<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">阵列可变方案：技术路线概览</title>
  <desc id="desc">从可变阵列输入出发，比较通道集合建模、规范空间投影、几何与物理条件化、通道无关组件四条主路线，并给出扩展路线、统一评测与预研推进顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E4FA8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
    .ink { fill: #1A2230; }
    .muted { fill: #667085; }
    .label { font-size: 14px; fill: #667085; }
    .body { font-size: 17px; fill: #1A2230; }
    .models { font-size: 16.5px; fill: #1A2230; }
    .constraint { font-size: 14px; fill: #344054; }
    .card-title { font-size: 22px; font-weight: 700; fill: #1A2230; }
    .card-number { font-size: 20px; font-weight: 700; }
  </style>

  <rect width="1600" height="900" fill="#F5F7FB"/>
  <rect width="1600" height="104" fill="#1E4FA8"/>
  <text x="64" y="45" font-size="34" font-weight="700" fill="#FFFFFF">阵列可变方案：技术路线概览</text>
  <text x="64" y="79" font-size="17" fill="#D8E5F6">Array-Variable / Array-Agnostic Speech Enhancement</text>
  <text x="1536" y="57" text-anchor="end" font-size="18" fill="#D8E5F6">空间表示与具体硬件解耦</text>

  <rect x="64" y="128" width="700" height="68" rx="12" fill="#EAF1FB" stroke="#C7D8F0"/>
  <text x="88" y="155" font-size="16" font-weight="700" fill="#1E4FA8">输入变化</text>
  <text x="88" y="181" font-size="17.5" class="ink">麦数 / 几何 / 通道顺序变化 · 缺麦 / 佩戴扰动</text>
  <line x1="778" y1="162" x2="816" y2="162" stroke="#1E4FA8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="836" y="128" width="700" height="68" rx="12" fill="#EAF1FB" stroke="#C7D8F0"/>
  <text x="860" y="155" font-size="16" font-weight="700" fill="#1E4FA8">核心目标</text>
  <text x="860" y="181" font-size="17.5" class="ink">空间信息与麦克风数量、几何排布和通道顺序解耦</text>

  <text x="64" y="231" font-size="20" font-weight="700" class="ink">四类主路线</text>
  <text x="184" y="231" font-size="15" class="muted">从架构、表示、条件与组件四个层面解耦</text>

  <g>
    <rect x="64" y="250" width="350" height="290" rx="14" fill="#FFFFFF" stroke="#D8E1EE"/>
    <path d="M78 250 H400 Q414 250 414 264 V256 H64 V264 Q64 250 78 250 Z" fill="#2F6BFF"/>
    <text x="88" y="290" class="card-number" fill="#2F6BFF">01</text>
    <text x="128" y="290" class="card-title">通道集合建模</text>
    <line x1="88" y1="309" x2="390" y2="309" stroke="#E4E9F0"/>
    <text x="88" y="337" class="label">核心机制</text>
    <text x="88" y="363" class="body">TAC / 跨通道注意力</text>
    <text x="88" y="387" class="body">Mean Pooling · 通道维聚合</text>
    <text x="88" y="420" class="label">代表方案</text>
    <text x="88" y="446" class="models">VarArray · DeFTAN-AA</text>
    <text x="88" y="470" class="models">FlexIO</text>
    <rect x="82" y="487" width="314" height="38" rx="8" fill="#EEF3FF"/>
    <text x="96" y="512" class="constraint">部分方案同阵列性能让步</text>
  </g>

  <g>
    <rect x="438" y="250" width="350" height="290" rx="14" fill="#FFFFFF" stroke="#D8E1EE"/>
    <path d="M452 250 H774 Q788 250 788 264 V256 H438 V264 Q438 250 452 250 Z" fill="#139D9A"/>
    <text x="462" y="290" class="card-number" fill="#139D9A">02</text>
    <text x="502" y="290" class="card-title">规范空间投影</text>
    <line x1="462" y1="309" x2="764" y2="309" stroke="#E4E9F0"/>
    <text x="462" y="337" class="label">核心机制</text>
    <text x="462" y="363" class="body">Ambisonics / Eigenbeam</text>
    <text x="462" y="387" class="body">投影到统一规范空间</text>
    <text x="462" y="420" class="label">代表方案</text>
    <text x="462" y="446" class="models">AmbiDrop · MSEN</text>
    <rect x="456" y="487" width="314" height="38" rx="8" fill="#EAF8F6"/>
    <text x="470" y="512" class="constraint">小阵列 / 低频 / 缺麦编码误差</text>
  </g>

  <g>
    <rect x="812" y="250" width="350" height="290" rx="14" fill="#FFFFFF" stroke="#D8E1EE"/>
    <path d="M826 250 H1148 Q1162 250 1162 264 V256 H812 V264 Q812 250 826 250 Z" fill="#D98324"/>
    <text x="836" y="290" class="card-number" fill="#D98324">03</text>
    <text x="876" y="290" class="card-title">几何与物理条件化</text>
    <line x1="836" y1="309" x2="1138" y2="309" stroke="#E4E9F0"/>
    <text x="836" y="337" class="label">核心机制</text>
    <text x="836" y="363" class="body">坐标驱动动态卷积</text>
    <text x="836" y="387" font-size="16" class="ink">Raw Mic + Beamformer 混合</text>
    <text x="836" y="420" class="label">代表方案</text>
    <text x="836" y="446" class="models">Geo-DConv · HyBeam</text>
    <rect x="830" y="487" width="314" height="38" rx="8" fill="#FFF5E8"/>
    <text x="844" y="512" class="constraint">依赖标定、同步或波束计算</text>
  </g>

  <g>
    <rect x="1186" y="250" width="350" height="290" rx="14" fill="#FFFFFF" stroke="#D8E1EE"/>
    <path d="M1200 250 H1522 Q1536 250 1536 264 V256 H1186 V264 Q1186 250 1200 250 Z" fill="#7A5AF8"/>
    <text x="1210" y="290" class="card-number" fill="#7A5AF8">04</text>
    <text x="1250" y="290" class="card-title">通道无关组件</text>
    <line x1="1210" y1="309" x2="1512" y2="309" stroke="#E4E9F0"/>
    <text x="1210" y="337" class="label">核心机制</text>
    <text x="1210" y="363" class="body">逐通道处理 + 聚合</text>
    <text x="1210" y="387" class="body">长短期空间相干特征</text>
    <text x="1210" y="420" class="label">代表方案</text>
    <text x="1210" y="446" class="models">MCSPP · LSTSC</text>
    <rect x="1204" y="487" width="314" height="38" rx="8" fill="#F3EFFF"/>
    <text x="1218" y="512" class="constraint">需与骨干及后端联合验证</text>
  </g>

  <rect x="64" y="562" width="1472" height="84" rx="12" fill="#FFF9EE" stroke="#EAD7B2"/>
  <text x="88" y="592" font-size="16" font-weight="700" fill="#9A5B00">扩展路线</text>
  <text x="196" y="592" font-size="16" class="ink">UniArray：通道归一 + 空间字典　·　REDnet：递归逐麦累积　·　SFB-NSE：固定滤波器组（换阵列需重算）</text>
  <text x="88" y="625" font-size="16" font-weight="700" fill="#9A5B00">少麦补全</text>
  <text x="196" y="625" font-size="16" class="ink">Spatial-Magnifier：固定已知几何的空间上采样，不等同于任意几何泛化</text>

  <rect x="64" y="670" width="1472" height="162" rx="12" fill="#FFFFFF" stroke="#D8E1EE"/>
  <text x="88" y="703" font-size="20" font-weight="700" class="ink">统一评测</text>
  <text x="196" y="703" font-size="16" class="muted">不能只测 Seen Array</text>

  <rect x="88" y="720" width="204" height="34" rx="17" fill="#F1F5FA"/>
  <text x="190" y="743" text-anchor="middle" font-size="14.5" fill="#40566F">Seen / Unseen 几何</text>
  <rect x="304" y="720" width="220" height="34" rx="17" fill="#F1F5FA"/>
  <text x="414" y="743" text-anchor="middle" font-size="14.5" fill="#40566F">通道数变化 / 缺麦</text>
  <rect x="536" y="720" width="220" height="34" rx="17" fill="#F1F5FA"/>
  <text x="646" y="743" text-anchor="middle" font-size="14.5" fill="#40566F">佩戴扰动 / 真实录音</text>
  <rect x="768" y="720" width="270" height="34" rx="17" fill="#F1F5FA"/>
  <text x="903" y="743" text-anchor="middle" font-size="14.5" fill="#40566F">增强质量 · 空间保真 · WER</text>
  <text x="88" y="794" font-size="16" fill="#4A5568">同条件比较：固定阵列强基线 · 统一训练 / 测试划分</text>

  <line x1="1072" y1="694" x2="1072" y2="808" stroke="#E1E7EF"/>
  <text x="1104" y="703" font-size="20" font-weight="700" class="ink">预研推进顺序</text>
  <line x1="1116" y1="744" x2="1116" y2="754" stroke="#9EB7DD" stroke-width="2"/>
  <line x1="1116" y1="779" x2="1116" y2="789" stroke="#9EB7DD" stroke-width="2"/>
  <circle cx="1116" cy="732" r="12" fill="#1E4FA8"/>
  <text x="1116" y="737" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="1140" y="738" font-size="16.5" class="ink">统一表示横评</text>
  <circle cx="1116" cy="767" r="12" fill="#1E4FA8"/>
  <text x="1116" y="772" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="1140" y="773" font-size="16.5" class="ink">接入生成式主干</text>
  <circle cx="1116" cy="802" r="12" fill="#1E4FA8"/>
  <text x="1116" y="807" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1140" y="808" font-size="16.5" class="ink">少麦补全（补充线）</text>

  <text x="64" y="870" font-size="14" fill="#7A8798">依据：Array-Agnostic SE 路线笔记　｜　主线：统一表示横评 → 生成式接入 → 少麦补全</text>
  <text x="1536" y="870" text-anchor="end" font-size="13" fill="#8B97A8" letter-spacing="1.2">ARRAY-VARIABLE SE</text>
</svg>
